<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build to Host</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600&family=Work+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --ink:#1E2321; --muted:#5C625F; --line:#DDDAD2; --accent:#16302A; --soft:#EEEBE3;
  --f-display:'League Spartan',system-ui,sans-serif; --f-body:'Work Sans',system-ui,sans-serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151816;--surface:#1D211F;--ink:#ECEAE4;--muted:#A9ADA7;--line:#343A36;--accent:#C9A464;--soft:#232825;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151816;--surface:#1D211F;--ink:#ECEAE4;--muted:#A9ADA7;--line:#343A36;--accent:#C9A464;--soft:#232825;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:20px}
.wrap{max-width:760px;margin:0 auto;padding-block:56px 80px;display:flex;flex-direction:column;gap:32px}
h1,h2{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(34px,6vw,48px)}
h2{font-size:21px}
p{margin:0}
.eyebrow{font-family:var(--f-display);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.list a{display:flex;flex-direction:column;gap:4px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none}
.list a:hover{border-color:var(--accent)}
.list a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list span{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main class="wrap">
  <header style="display:flex;flex-direction:column;gap:12px">
    <p class="eyebrow">Build to Host</p>
    <h1>Materiali di lavoro</h1>
    <p style="color:var(--muted)">Pagine condivise con il team per discutere le scelte prima di portarle nel sito e nel CRM.</p>
  </header>
  <ul class="list">
    <li><a href="palette/"><h2>Palette Build to Host</h2><span>Tre varianti colore da valutare con il team.</span></a></li>
  </ul>
</main>
</body>
</html>
